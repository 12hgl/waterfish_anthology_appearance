name: 投稿一套外观
description: 把你写好的主题 JS 交上来。审核通过后会出现在外观库里，别人可以直接下载。
title: "[投稿] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚一件事：**主题 JS 会在别人的浏览器里跑**（页面主世界，能碰到 DOM）。
        所以我们会看代码，不只是看效果。审核标准很直白——只做外观的事，别碰数据。

        写之前建议先读一遍 [投稿说明](https://github.com/12hgl/waterfish_anthology_appearance/blob/main/CONTRIBUTING.md)。

  - type: input
    id: author
    attributes:
      label: 作者
      description: 你的 GitHub 用户名（不带 @），收录后会署在页面和 README 上。
      placeholder: your-github-name
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 名称
      description: 2–8 个字，尽量别跟库里已有的重名。想想你希望别人在卡片上看到什么。
      placeholder: 湖心纸
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 简介
      description: 一句话，30 字以内，说清楚它是什么感觉、适合什么时候用。可选但强烈建议写。
      placeholder: 湖蓝压在微冷的米白上，看一整天眼睛不发干。
      render: text
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: 希望分类
      description: |
        只是个意向，最终归类由维护者决定。注意「推荐」不开放投稿——那几套是维护者自己长期在用的。
      options:
        - 简洁
        - 阅读
        - 深色
        - 色彩
        - 动效
        - 字体
    validations:
      required: false

  - type: textarea
    id: code
    attributes:
      label: JS 内容
      description: |
        直接把主题文件的内容贴进来，**用一个 ```js 代码块包住**。
        简短写法示例：

        ```js
        主色: #1F6C9F
        底色: #F4F7F9
        ```
        文件超过 40 KB 的话，贴 raw 链接（`raw.githubusercontent.com` 或 gist 直链），一行就够。
      render: javascript
      placeholder: |
        ```js
        主色: #8C5A2B
        底色: #F7F1E6
        圆角: 12
        ```
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这套外观是我自己写的，或者我有权以 MIT 协议分享它
          required: true
        - label: 代码里没有网络请求、没有读写 cookie / localStorage、没有 eval 之类的动态执行
          required: true
        - label: 我同意收录后以 MIT 协议随本仓库一起分发
          required: true
