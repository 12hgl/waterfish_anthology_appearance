name: 投稿一套外观
description: 交一个 .js 主题。审核通过后会被收进外观库，别人可以直接下载。
title: "[投稿] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        投稿前请确认一件事：**主题会在别人的浏览器里执行**。所以我们看代码，不只看效果。

        约定很简单——只碰外观（CSS 变量、样式、图标、字体），别碰数据。
        详细规则见 [CONTRIBUTING.md](https://github.com/12hgl/waterfish_anthology_appearance/blob/main/CONTRIBUTING.md)。

  - type: input
    id: author
    attributes:
      label: 作者
      description: 你的 GitHub 用户名，不带 @。收录后会署在页面上。
      placeholder: your-github-name
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 名称
      description: 2–8 个字。尽量别和库里已有的重名，重名会被打回。
      placeholder: 松烟
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 简介
      description: 一句话，30 字以内，说清是什么感觉、什么时候用。可选，但强烈建议写。
      placeholder: 灰绿压住暖白，像旧纸上落了一层松烟墨。
      render: text
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: 希望分类
      description: |
        只是意向，最终归类由维护者定。「推荐」不开放投稿——那几套是维护者自己在用的。
      options:
        - 素净
        - 阅读
        - 夜间
        - 撞色
        - 动效
        - 字体
    validations:
      required: false

  - type: textarea
    id: code
    attributes:
      label: JS 内容
      description: |
        把主题文件整个贴进来，用 ```js 代码块包住。超过 40 KB 的话贴 raw 链接就行。
        简单写法示例：

        ```js
        主色: #3E5C50
        底色: #F7F5EE
        ```
      render: javascript
      placeholder: |
        ```js
        主色: #8C5B33
        底色: #F4EEE2
        圆角: 4
        ```
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这套是我自己写的，或者我有权以 MIT 协议分享
          required: true
        - label: 代码里没有网络请求、没有读写 cookie / localStorage、没有 eval 之类的动态执行
          required: true
        - label: 我同意收录后以 MIT 协议随本仓库分发
          required: true
