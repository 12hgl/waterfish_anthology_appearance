name: 校验外观库

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 目录结构 + 静态安全规则
        run: node scripts/validate-all.mjs --report

      - name: 构建一次站点，确认不会把 Vercel 构建搞挂
        if: always()
        run: |
          node scripts/build-index.mjs
          node site/build.mjs
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
