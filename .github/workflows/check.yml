name: 校验

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 目录结构、哈希、README
        run: node scripts/verify.mjs

      - name: 构建一次，别把 Vercel 的构建搞挂
        run: node site/build.mjs
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://appearance.waterfish.ren' }}
